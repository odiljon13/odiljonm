<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Market | Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <header class="admin-header">
            <div class="admin-brand">
                <div class="admin-logo-icon">🍇</div>
                <div>
                    <h1>Uzum Admin Panel</h1>
                    <span class="admin-subtitle">Mahsulotlar Boshqaruvi va Tahrirlash Tizimi</span>
                </div>
            </div>

            <div class="admin-header-actions">
                <a href="../html/index.html" class="btn-shop-view" style="padding: 10px 18px; background: rgba(255,255,255,0.1); color: white; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 14px;">
                    🛍 Do'konni ko'rish
                </a>
                <button id="openAddProdBtn" class="btn-add-user" style="background: linear-gradient(135deg, #7000ff, #8b2cf5);">
                    ➕ Yangi mahsulot qo'shish
                </button>
                <button id="adminLogoutBtn" class="btn-admin-logout">
                    🚪 Chiqish
                </button>
            </div>
        </header>

        <!-- Admin Statistika Kartalari -->
        <div class="admin-dashboard">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(112, 0, 255, 0.2); color: #a855f7;">🛍</div>
                <div class="stat-info">
                    <span>Jami Mahsulotlar</span>
                    <strong id="statProductsCount">0 ta</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">🗂</div>
                <div class="stat-info">
                    <span>Toifalar Soni</span>
                    <strong id="statCategoriesCount">0 ta</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(236, 72, 153, 0.2); color: #f472b6;">⚡</div>
                <div class="stat-info">
                    <span>Baza Holati</span>
                    <strong style="color: #34d399;">Uzum Sync (Faol)</strong>
                </div>
            </div>
        </div>

        <!-- Qidiruv va Filtr Bar -->
        <div class="admin-controls-bar">
            <div class="admin-search-wrapper">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="adminProdSearch" placeholder="Mahsulotlarni nomi yoki ta'rifi bo'yicha qidiring...">
            </div>
            <div class="admin-cat-filter">
                <select id="adminCatSelect" style="padding: 12px 18px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.15); background: #161b22; color: white; font-size: 14px; outline: none;">
                    <option value="all">Barcha toifalar</option>
                    <option value="Elektronika">Elektronika</option>
                    <option value="Maishiy texnika">Maishiy texnika</option>
                    <option value="Kiyim-kechak">Kiyim-kechak</option>
                    <option value="Go'zallik va parvarish">Go'zallik va parvarish</option>
                    <option value="Uy-ro'zg'or buyumlari">Uy-ro'zg'or buyumlari</option>
                </select>
            </div>
        </div>

        <div id="adminProdContainer" class="admin-prod-grid"></div>
    </div>

    <!-- Yangi mahsulot qo'shish modali -->
    <div id="addProdModal" class="img-modal">
        <div style="background: #161b22; border: 1.5px solid rgba(255,255,255,0.15); padding: 32px; border-radius: 24px; width: 100%; max-width: 520px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto;">
            <span id="closeAddProdModal" style="position: absolute; top: 18px; right: 22px; font-size: 28px; color: #fff; cursor: pointer;">&times;</span>
            <h2 style="margin-bottom: 22px; color: #fff; font-size: 20px; font-weight: 700;">➕ Uzum Market: Yangi Mahsulot Qo'shish</h2>
            <form id="addProdForm" style="display: flex; flex-direction: column; gap: 14px;">
                <input type="text" id="apTitle" placeholder="Mahsulot nomi (masalan, Smartfon Xiaomi...)" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <input type="number" id="apPrice" placeholder="Narxi (so'mda, masalan, 2450000)" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <select id="apCategory" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                    <option value="Elektronika">Elektronika</option>
                    <option value="Maishiy texnika">Maishiy texnika</option>
                    <option value="Kiyim-kechak">Kiyim-kechak</option>
                    <option value="Go'zallik va parvarish">Go'zallik va parvarish</option>
                    <option value="Uy-ro'zg'or buyumlari">Uy-ro'zg'or buyumlari</option>
                </select>
                <input type="text" id="apBadge" placeholder="Belgi (masalan, Top sotuv, Super narx)" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <input type="url" id="apImg1" placeholder="Asosiy rasm URL-si (1-rasm)" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <input type="url" id="apImg2" placeholder="Qo'shimcha 2-rasm URL-si (Ixtiyoriy)" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <textarea id="apDesc" placeholder="Mahsulot ta'rifi va xususiyatlari..." required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px; min-height: 80px; resize: vertical;"></textarea>
                <button type="submit" style="padding: 14px; background: linear-gradient(135deg, #7000ff, #9333ea); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 15px; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.4);">Saqlash va Bazaga Qo'shish</button>
            </form>
        </div>
    </div>

    <!-- Mahsulotni tahrirlash (Edit) modali -->
    <div id="editProdModal" class="img-modal">
        <div style="background: #161b22; border: 1.5px solid rgba(255,255,255,0.15); padding: 32px; border-radius: 24px; width: 100%; max-width: 520px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto;">
            <span id="closeEditProdModal" style="position: absolute; top: 18px; right: 22px; font-size: 28px; color: #fff; cursor: pointer;">&times;</span>
            <h2 style="margin-bottom: 22px; color: #fff; font-size: 20px; font-weight: 700;">✏️ Mahsulotni Tahrirlash</h2>
            <form id="editProdForm" style="display: flex; flex-direction: column; gap: 14px;">
                <input type="hidden" id="epId">
                <input type="text" id="epTitle" placeholder="Mahsulot nomi" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <input type="number" id="epPrice" placeholder="Narxi (so'mda)" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <select id="epCategory" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                    <option value="Elektronika">Elektronika</option>
                    <option value="Maishiy texnika">Maishiy texnika</option>
                    <option value="Kiyim-kechak">Kiyim-kechak</option>
                    <option value="Go'zallik va parvarish">Go'zallik va parvarish</option>
                    <option value="Uy-ro'zg'or buyumlari">Uy-ro'zg'or buyumlari</option>
                </select>
                <input type="text" id="epBadge" placeholder="Belgi" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <input type="url" id="epImg1" placeholder="Rasm URL-si" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px;">
                <textarea id="epDesc" placeholder="Mahsulot ta'rifi..." required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 14px; min-height: 80px; resize: vertical;"></textarea>
                <button type="submit" style="padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 15px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);">O'zgarishlarni Saqlash</button>
            </form>
        </div>
    </div>

    <script src="../js/uzum_data.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
