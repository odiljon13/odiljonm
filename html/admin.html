<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
    <div class="admin-wrapper">
        <header class="admin-header">
            <div class="admin-brand">
                <div class="admin-logo-icon">⚡</div>
                <div>
                    <h1>Admin Panel</h1>
                    <span class="admin-subtitle">Boshqaruv va Foydalanuvchilar Tizimi</span>
                </div>
            </div>

            <div class="admin-header-actions">
                <button id="openAddUserBtn" class="btn-add-user">
                    ➕ Yangi inson qo'shish
                </button>
                <button id="adminLogoutBtn" class="btn-admin-logout">
                    🚪 Chiqish
                </button>
            </div>
        </header>

        <!-- Admin Statistika Kartalari (Dashboard) -->
        <div class="admin-dashboard">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(99, 102, 241, 0.2); color: #818cf8;">👥</div>
                <div class="stat-info">
                    <span>Foydalanuvchilar</span>
                    <strong id="statUsersCount">0 ta</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">🛍</div>
                <div class="stat-info">
                    <span>Mahsulotlar</span>
                    <strong id="statProductsCount">0 ta</strong>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(236, 72, 153, 0.2); color: #f472b6;">🟢</div>
                <div class="stat-info">
                    <span>Tizim Holati</span>
                    <strong style="color: #34d399;">Faol (Online)</strong>
                </div>
            </div>
        </div>

        <!-- Qidiruv va Filtr Bar -->
        <div class="admin-controls-bar">
            <div class="admin-search-wrapper">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="adminUserSearch" placeholder="Foydalanuvchilarni ism yoki email bo'yicha qidiring...">
            </div>
            <div class="section-title">
                <h2>👥 Foydalanuvchilar Ro'yxati</h2>
            </div>
        </div>

        <div id="container"></div>
    </div>

    <!-- Yangi foydalanuvchi qo'shish modali -->
    <div id="addUserModal" class="img-modal">
        <div style="background: #161b22; border: 1.5px solid rgba(255,255,255,0.15); padding: 32px; border-radius: 24px; width: 100%; max-width: 460px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6);">
            <span id="closeAddUserModal" style="position: absolute; top: 18px; right: 22px; font-size: 28px; color: #fff; cursor: pointer;">&times;</span>
            <h2 style="margin-bottom: 22px; color: #fff; font-size: 22px; font-weight: 700;">➕ Yangi foydalanuvchi qo'shish</h2>
            <form id="addUserForm" style="display: flex; flex-direction: column; gap: 14px;">
                <input type="text" id="uNameInp" placeholder="Ism va Familiya" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 15px;">
                <input type="email" id="uEmailInp" placeholder="Email manzil" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 15px;">
                <input type="number" id="uAgeInp" placeholder="Yoshi" required style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 15px;">
                <input type="url" id="uImgInp" placeholder="Rasm URL-si (Ixtiyoriy)" style="padding: 13px 16px; border-radius: 12px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; font-size: 15px;">
                <button type="submit" style="padding: 13px; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 16px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);">Saqlash va qo'shish</button>
            </form>
        </div>
    </div>

    <!-- Rasmni katta ko'rsatuvchi modal oyna -->
    <div id="imgModal" class="img-modal">
        <span id="imgModalClose">&times;</span>
        <img id="imgModalPic" src="" alt="Foydalanuvchi rasmi">
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
</html>
