<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahsulot | Odiljon Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/single.css?v=2026">
    <script src="../js/i18n.js"></script>
    <style>
      .singleDelet, .singleUpdate, button.singleDelet, button.singleUpdate, [class*="singleDelet"], [class*="singleUpdate"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
</head>
<body>

    <div class="loading_close">
        <h1>Loading...</h1>
    </div>

    <div style="padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;">
        <button class="backPage">← Bosh sahifaga qaytish</button>
        
        <!-- 10 Language Selector Dropdown -->
        <div class="lang-selector-wrapper" style="display: inline-flex; align-items: center; background: #f1f5f9; padding: 4px 12px; border-radius: 20px; border: 1px solid #cbd5e1;">
          <span style="font-size: 14px; margin-right: 6px;">🌐</span>
          <select class="lang-selector-select" onchange="setLanguage(this.value)" style="background: transparent; color: #1e293b; border: none; font-weight: 700; font-size: 13px; cursor: pointer; outline: none;">
            <option value="uz">🇺🇿 O'zbekcha</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="en">🇬🇧 English</option>
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="kk">🇰🇿 Қазақша</option>
            <option value="ky">🇰🇬 Кыргызча</option>
            <option value="tg">🇹🇯 Тоҷикӣ</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="zh">🇨🇳 中文</option>
          </select>
        </div>
    </div>
   <div class="single">
     <div class="single-media">
            <img src="" alt="" class="single_img">
        </div>

        <div class="single-body">
            <h1 class="single_title"></h1>

            <div class="single-price-tag">
                <strong class="single_price"></strong>
            </div>



            <p class="single_text"></p>

            <div class="single-divider" aria-hidden="true"></div>

            <p class="single_desc"></p>
        </div>

   </div>

   <div class="comments-container">
        <div class="comments-header">
            <h2>💬 Fikrlar va izohlar <span id="comments-count-badge">0</span></h2>
            <div id="average-rating" class="average-rating">⭐️ 5.0 / 5</div>
        </div>

        <form id="commentForm" class="comment-form">
            <h3>⭐ Izohingizni qoldiring va Rasm yuklang</h3>
            <div class="form-row">
                <input type="text" id="commentName" placeholder="Ismingizni kiriting..." required>
                <select id="commentRating" required>
                    <option value="5">⭐️⭐️⭐️⭐️⭐️ (5 - A'lo)</option>
                    <option value="4">⭐️⭐️⭐️⭐️ (4 - Yaxshi)</option>
                    <option value="3">⭐️⭐️⭐️ (3 - Qoniqarli)</option>
                    <option value="2">⭐️⭐️ (2 - Yomon emas)</option>
                    <option value="1">⭐️ (1 - Yomon)</option>
                </select>
            </div>
            <div style="margin-bottom: 12px;">
                <input type="url" id="commentPhotoUrl" placeholder="📸 Tovar rasmi URL-si (masalan: https://...)" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; outline: none;">
            </div>
            <textarea id="commentText" placeholder="Mahsulot haqida o'z fikringiz va taassurotlaringizni yozing..." rows="4" required></textarea>
            <button type="submit" class="submit-comment-btn"><i class="bi bi-send-fill"></i> Izoh va Rasmni yuborish</button>
        </form>

        <div id="commentsList" class="comments-list">
            <!-- Dynamic comments appear here -->
        </div>
   </div>

    <script src="../js/uzum_data.js"></script>
    <script src="../js/single.js"></script>
</body>
</html>
