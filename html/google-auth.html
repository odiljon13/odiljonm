<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f0f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; width: 400px; padding: 36px 40px; border-radius: 28px; text-align: center; color: #1f1f1f; }
        .logo { width: 75px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 400; margin: 0 0 10px; }
        p { font-size: 16px; margin: 0 0 35px; color: #1f1f1f; }
        .input-group { text-align: left; margin-bottom: 20px; position: relative; }
        input { width: 100%; box-sizing: border-box; padding: 16px 14px; font-size: 16px; border: 1px solid #747775; border-radius: 4px; outline: none; }
        input:focus { border: 2px solid #0b57d0; padding: 15px 13px; }
        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; }
        .create-btn { color: #0b57d0; text-decoration: none; font-weight: 500; font-size: 14px; cursor: pointer; }
        .next-btn { background: #0b57d0; color: #fff; border: none; padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .next-btn:hover { background: #0842a0; }
        #step2 { display: none; }
        .user-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #747775; padding: 4px 12px 4px 4px; border-radius: 16px; margin-bottom: 35px; font-size: 14px; font-weight: 500; }
        .user-chip img { width: 24px; height: 24px; border-radius: 50%; }
        .loading { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container" id="step1">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="logo">
        <h1>Sign in</h1>
        <p>Use your Google Account</p>
        <div class="input-group">
            <input type="email" id="emailInp" placeholder="Email or phone" autofocus>
        </div>
        <div style="text-align: left; margin-bottom: 30px;">
            <a href="#" style="color: #0b57d0; text-decoration: none; font-weight: 500; font-size: 14px;">Forgot email?</a>
        </div>
        <div style="text-align: left; font-size: 14px; color: #444746; margin-bottom: 30px;">
            Not your computer? Use Guest mode to sign in privately. <a href="#" style="color: #0b57d0; text-decoration: none; font-weight: 500;">Learn more</a>
        </div>
        <div class="btn-row">
            <span class="create-btn">Create account</span>
            <button class="next-btn" id="nextBtn1">Next</button>
        </div>
    </div>

    <div class="container" id="step2">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="logo">
        <h1>Welcome</h1>
        <div class="user-chip">
            <img src="https://ui-avatars.com/api/?name=User&background=0b57d0&color=fff" id="chipAvatar" alt="">
            <span id="chipEmail">user@gmail.com</span>
        </div>
        <div class="input-group">
            <input type="password" id="passInp" placeholder="Enter your password">
        </div>
        <div style="text-align: left; margin-bottom: 30px;">
            <input type="checkbox" id="showPass"> <label for="showPass" style="font-size: 14px;">Show password</label>
        </div>
        <div class="btn-row">
            <span class="create-btn">Forgot password?</span>
            <button class="next-btn" id="nextBtn2">Next</button>
        </div>
        <div class="loading" id="loader">Signing in...</div>
    </div>

    <script>
        let email = "";
        document.getElementById("nextBtn1").addEventListener("click", () => {
            email = document.getElementById("emailInp").value.trim();
            if (!email) return;
            document.getElementById("chipEmail").textContent = email;
            document.getElementById("chipAvatar").src = `https://ui-avatars.com/api/?name=${encodeURIComponent(email)}&background=0b57d0&color=fff`;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            document.getElementById("passInp").focus();
        });

        document.getElementById("showPass").addEventListener("change", (e) => {
            document.getElementById("passInp").type = e.target.checked ? "text" : "password";
        });

        document.getElementById("nextBtn2").addEventListener("click", () => {
            let pass = document.getElementById("passInp").value.trim();
            if (!pass) return;
            document.getElementById("loader").style.display = "block";
            document.getElementById("nextBtn2").style.display = "none";
            
            setTimeout(() => {
                let name = email.split('@')[0];
                let mockGoogleUser = {
                    provider: "Google",
                    email: email,
                    firstName: name.charAt(0).toUpperCase() + name.slice(1),
                    username: name,
                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`
                };
                
                if (window.opener) {
                    window.opener.postMessage({ type: 'OAUTH_SUCCESS', user: mockGoogleUser }, '*');
                }
                window.close();
            }, 1200);
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (document.getElementById("step1").style.display !== "none") {
                    document.getElementById("nextBtn1").click();
                } else {
                    document.getElementById("nextBtn2").click();
                }
            }
        });
    </script>
</body>
</html>
