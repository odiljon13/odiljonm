<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="wishlist">Saralanganlar | Odiljon Shop</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/wishlist.css">
    <script src="../js/i18n.js"></script>
</head>
<body>
    <header class="header">
        <h1><a href="../index.html" style="text-decoration: none; color: inherit;">odiljon</a></h1>
        <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
            <!-- 10 Language Selector Dropdown -->
            <div class="lang-selector-wrapper" style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25);">
              <span style="font-size: 14px; margin-right: 6px;">🌐</span>
              <select class="lang-selector-select" onchange="setLanguage(this.value)" style="background: transparent; color: inherit; border: none; font-weight: 700; font-size: 13px; cursor: pointer; outline: none;">
                <option value="uz" style="background: #1e293b; color: #fff;">🇺🇿 O'zbekcha</option>
                <option value="ru" style="background: #1e293b; color: #fff;">🇷🇺 Русский</option>
                <option value="en" style="background: #1e293b; color: #fff;">🇬🇧 English</option>
                <option value="tr" style="background: #1e293b; color: #fff;">🇹🇷 Türkçe</option>
                <option value="kk" style="background: #1e293b; color: #fff;">🇰🇿 Қазақша</option>
                <option value="ky" style="background: #1e293b; color: #fff;">🇰🇬 Кыргызча</option>
                <option value="tg" style="background: #1e293b; color: #fff;">🇹🇯 Тоҷикӣ</option>
                <option value="de" style="background: #1e293b; color: #fff;">🇩🇪 Deutsch</option>
                <option value="fr" style="background: #1e293b; color: #fff;">🇫🇷 Français</option>
                <option value="zh" style="background: #1e293b; color: #fff;">🇨🇳 中文</option>
              </select>
            </div>
            <a href="../index.html" class="nav-btn"><i class="bi bi-house-door"></i> Bosh sahifa</a>
            <a href="../html/wishlist.html" class="nav-btn" style="background: #fdf2f8; color: #ec4899;"><i class="bi bi-heart-fill"></i> Saralanganlar</a>
            <a href="../html/orders.html" class="nav-btn" style="background: #eff6ff; color: #3b82f6;"><i class="bi bi-box-seam-fill"></i> Buyurtmalarim</a>
            <a href="../html/cart.html" class="nav-btn"><i class="bi bi-cart3"></i> Savatcha</a>
            <button id="themeToggleBtn" class="theme-btn" title="Rejimni o'zgartirish"><i class="bi bi-moon-stars-fill"></i></button>
            <button id="logout" data-i18n="logout">Chiqish</button>
        </div>
    </header>

    <main class="wishlist-container">
        <div class="wishlist-header-title">
            <h2>❤️ Saralangan mahsulotlar</h2>
            <span id="wishlist-badge">0 ta mahsulot</span>
        </div>

        <div id="wishlist-grid" class="wishlist-grid">
            <!-- Wishlist cards appear here -->
        </div>
    </main>

    <script src="../js/wishlist.js"></script>
</body>
</html>
