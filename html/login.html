<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Tizimga Kirish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="loading_close">
        <h1>Loading...</h1>
    </div>

    <div class="login-card">
        <div class="login-card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="lang-selector-wrapper" style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25);">
              <span style="font-size: 13px; margin-right: 4px;">🌐</span>
              <select class="lang-selector-select" onchange="setLanguage(this.value)" style="background: transparent; color: inherit; border: none; font-weight: 700; font-size: 12px; cursor: pointer; outline: none;">
                <option value="uz" style="background: #1e293b; color: #fff;">🇺🇿 UZB</option>
                <option value="ru" style="background: #1e293b; color: #fff;">🇷🇺 RUS</option>
                <option value="en" style="background: #1e293b; color: #fff;">🇬🇧 ENG</option>
                <option value="tr" style="background: #1e293b; color: #fff;">🇹🇷 TUR</option>
                <option value="kk" style="background: #1e293b; color: #fff;">🇰🇿 KAZ</option>
                <option value="ky" style="background: #1e293b; color: #fff;">🇰🇬 KGZ</option>
                <option value="tg" style="background: #1e293b; color: #fff;">🇹🇯 TJK</option>
                <option value="de" style="background: #1e293b; color: #fff;">🇩🇪 DEU</option>
                <option value="fr" style="background: #1e293b; color: #fff;">🇫🇷 FRA</option>
                <option value="zh" style="background: #1e293b; color: #fff;">🇨🇳 CHN</option>
              </select>
            </div>
            <button id="themeToggleBtn" class="login-theme-btn" title="Kun/Tun rejimini o'zgartirish">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>
        <h2>Xush kelibsiz!</h2>
        <p class="subtitle">Hisobingizga kiring</p>
        <form action="#">
            <div class="input-group">
                <label for="name">Ism kiriting</label>
                <input type="text" id="name" placeholder="Ismingizni kiriting" class="inpName" required>
            </div>

            <div class="input-group">
                <label for="pass">Parol kiriting</label>
                <div class="password-wrapper">
                    <input type="password" id="pass" placeholder="Parolingizni kiriting" class="inpParol" required>
                    <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Parolni ko'rsatish/yashirish">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="sendUser">Kirish</button>
        </form>

        <div style="margin-top: 20px; padding: 12px; background: rgba(255,255,255,0.06); border-radius: 10px; font-size: 13px; color: #a1a1aa; line-height: 1.5; border: 1px dashed rgba(255,255,255,0.15);">
            
            
        </div>
    </div>

    <div class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-icon">!</div>
            <h3 class="modal_title">Sarlavha</h3>
            <p class="modal-text">Xabar matni</p>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
