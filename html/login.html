<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Tizimga Kirish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/i18n.js"></script>
</head>
<body>

    <div class="loading_close">
        <h1>Loading...</h1>
    </div>

    <div class="login-card">
        <div class="login-card-header" style="display: flex; justify-content: flex-end; align-items: center;">
            <button id="themeToggleBtn" class="login-theme-btn" title="Kun/Tun rejimini o'zgartirish">
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>
        <div class="auth-toggle">
            <button class="auth-tab active" id="tabLogin">Kirish</button>
            <button class="auth-tab" id="tabRegister">Ro'yxatdan o'tish</button>
        </div>

        <h2 id="authTitle">Xush kelibsiz!</h2>
        <p class="subtitle" id="authSubtitle">Hisobingizga kiring</p>
        
        <form action="#" id="loginForm">
            <div class="input-group">
                <label for="name">Ism kiriting</label>
                <input type="text" id="name" placeholder="Ismingizni kiriting" class="inpName" required>
            </div>

            <div class="input-group">
                <label for="pass">Parol kiriting</label>
                <div class="password-wrapper">
                    <input type="password" id="pass" placeholder="Parolingizni kiriting" class="inpParol" required>
                    <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Parolni ko'rsatish/yashirish">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="sendUser">Kirish</button>
        </form>

        <form action="#" id="registerForm" style="display: none;">
            <div class="input-group">
                <label for="regName">Ism kiriting</label>
                <input type="text" id="regName" placeholder="Ismingizni kiriting" required>
            </div>

            <div class="input-group">
                <label for="regEmail">Email kiriting</label>
                <input type="email" id="regEmail" placeholder="Emailingizni kiriting" required>
            </div>

            <div class="input-group">
                <label for="regPass">Parol kiriting</label>
                <div class="password-wrapper">
                    <input type="password" id="regPass" placeholder="Yangi parol kiriting" required>
                    <button type="button" class="toggle-password-btn" id="toggleRegPasswordBtn" title="Parolni ko'rsatish/yashirish">
                        <i class="bi bi-eye-slash" id="eyeRegIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="sendRegister">Ro'yxatdan o'tish</button>
        </form>

    </div>

    <div class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-icon">!</div>
            <h3 class="modal_title">Sarlavha</h3>
            <p class="modal-text">Xabar matni</p>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
