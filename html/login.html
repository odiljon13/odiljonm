<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-card">
        <h2>Xush kelibsiz!</h2>
        <p class="subtitle">Davom etish uchun hisobingizga kiring</p>
        <form action="#">
            <div class="input-group">
                <label for="name">Ismingiz</label>
                <input type="text" id="name" placeholder="Ismingizni kiriting" class="inpName" required>
            </div><!--/.input-group-->

            <div class="input-group">
                <label for="pass">Parolingiz</label>
                <input type="password" id="pass" placeholder="Parolingizni kiriting" class="inpParol" required>
            </div><!--/.input-group-->

            <button type="submit" id="sendUser">Kirish</button>
        </form>
    </div><!--/.login-card-->
<script src="../js/login.js"></script>
</body>
</html>
