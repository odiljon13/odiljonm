<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        body { font-family: 'Segoe UI', 'Helvetica Neue', 'Lucida Grande', 'Roboto', sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; width: 440px; padding: 44px; box-sizing: border-box; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .logo { width: 108px; margin-bottom: 24px; }
        h1 { font-size: 24px; font-weight: 600; margin: 0 0 16px; color: #1b1b1b; }
        .input-group { text-align: left; margin-bottom: 16px; }
        input { width: 100%; box-sizing: border-box; padding: 6px 0; font-size: 15px; border: none; border-bottom: 1px solid #666; outline: none; }
        input:focus { border-bottom: 2px solid #0067b8; padding-bottom: 5px; }
        .create-link { color: #0067b8; text-decoration: none; font-size: 13px; }
        .create-link:hover { text-decoration: underline; }
        .btn-row { display: flex; justify-content: flex-end; margin-top: 32px; }
        .next-btn { background: #0067b8; color: #fff; border: none; padding: 8px 32px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .next-btn:hover { background: #005da6; }
        .user-chip { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .user-chip .back-arrow { font-size: 20px; cursor: pointer; color: #1b1b1b; text-decoration: none; margin-right: 8px; }
        #step2 { display: none; }
        .loading { display: none; margin-top: 16px; color: #1b1b1b; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container" id="step1">
        <img src="https://www.svgrepo.com/show/448239/microsoft.svg" alt="Microsoft" class="logo" style="width: 32px; margin-bottom: 16px;">
        <h1 style="font-size: 20px;">Sign in</h1>
        <div class="input-group">
            <input type="email" id="emailInp" placeholder="Email, phone, or Skype" autofocus>
        </div>
        <div>
            <span style="font-size: 13px;">No account? <a href="#" class="create-link">Create one!</a></span>
        </div>
        <div>
            <a href="#" class="create-link" style="display: block; margin-top: 16px;">Sign in with a security key</a>
        </div>
        <div class="btn-row">
            <button class="next-btn" id="nextBtn1">Next</button>
        </div>
    </div>

    <div class="container" id="step2">
        <img src="https://www.svgrepo.com/show/448239/microsoft.svg" alt="Microsoft" class="logo" style="width: 32px; margin-bottom: 16px;">
        <div class="user-chip">
            <span class="back-arrow" id="backBtn">&#8592;</span>
            <span id="chipEmail" style="font-size: 15px; color: #1b1b1b;">user@outlook.com</span>
        </div>
        <h1 style="font-size: 20px;">Enter password</h1>
        <div class="input-group">
            <input type="password" id="passInp" placeholder="Password">
        </div>
        <div>
            <a href="#" class="create-link">Forgot my password</a>
        </div>
        <div class="btn-row">
            <button class="next-btn" id="nextBtn2">Sign in</button>
        </div>
        <div class="loading" id="loader">Please wait...</div>
    </div>

    <script>
        let email = "";
        document.getElementById("nextBtn1").addEventListener("click", () => {
            email = document.getElementById("emailInp").value.trim();
            if (!email) return;
            document.getElementById("chipEmail").textContent = email;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
            document.getElementById("passInp").focus();
        });

        document.getElementById("backBtn").addEventListener("click", () => {
            document.getElementById("step2").style.display = "none";
            document.getElementById("step1").style.display = "block";
        });

        document.getElementById("nextBtn2").addEventListener("click", () => {
            let pass = document.getElementById("passInp").value.trim();
            if (!pass) return;
            document.getElementById("loader").style.display = "block";
            document.getElementById("nextBtn2").style.display = "none";
            
            setTimeout(() => {
                let name = email.split('@')[0];
                let mockMsUser = {
                    provider: "Microsoft",
                    email: email,
                    firstName: name.charAt(0).toUpperCase() + name.slice(1),
                    username: name,
                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=00a4ef&color=fff`
                };
                
                if (window.opener) {
                    window.opener.postMessage({ type: 'OAUTH_SUCCESS', user: mockMsUser }, '*');
                }
                window.close();
            }, 1200);
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                if (document.getElementById("step1").style.display !== "none") {
                    document.getElementById("nextBtn1").click();
                } else {
                    document.getElementById("nextBtn2").click();
                }
            }
        });
    </script>
</body>
</html>
